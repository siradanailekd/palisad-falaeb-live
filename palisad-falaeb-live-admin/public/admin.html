<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จัดการคำถาม | ปริศนาฟ้าแลบ</title><style>
:root{--bg:#081226;--panel:#112345;--line:#35527f;--cyan:#48e6ff;--gold:#ffd34e;--green:#48e2a3;--red:#ff6385}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1b3975,#081226 60%);color:#fff;font-family:system-ui,sans-serif;min-height:100vh}main{max-width:1050px;margin:auto;padding:22px 16px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.logo{font-size:clamp(24px,4vw,36px);font-weight:1000;color:var(--gold)}.card{background:linear-gradient(145deg,#14294e,#0c1b35);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:16px;box-shadow:0 12px 36px #0004}.muted{color:#aabbd8}.hidden{display:none!important}input,textarea,select{width:100%;padding:12px;border:1px solid #45618d;background:#091a34;color:#fff;border-radius:10px;font:inherit;margin:5px 0 12px}textarea{min-height:80px;resize:vertical}label{font-weight:700;font-size:14px}button{border:0;border-radius:10px;padding:11px 15px;font:inherit;font-weight:850;cursor:pointer}.gold{background:linear-gradient(90deg,#ffe36b,#ffb52d);color:#18223a}.blue{background:#1c3b69;color:white;border:1px solid #5576a7}.red{background:#742b45;color:white;border:1px solid #a84b68}.ghost{background:#233e68;color:#fff;border:1px solid #4d6a98}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#09182e;padding:12px 15px;border-radius:12px}.stat b{color:var(--gold);font-size:22px}.item{background:#09182e;border:1px solid #2b456d;border-radius:13px;padding:14px;margin-top:10px}.item h3{margin:0 0 8px}.tag{display:inline-block;border-radius:99px;background:#1d4165;color:#8eeaff;padding:4px 9px;font-size:12px}.msg{padding:11px;border-radius:10px;margin:10px 0;background:#17395a;color:#bcefff}.err{background:#52243a;color:#ffd4df}.correct{color:var(--green)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.right{margin-left:auto}@media(max-width:650px){.grid,.options{grid-template-columns:1fr}.card{padding:15px}.row>*{flex-basis:100%}}
</style></head><body><main>
<div class="top"><div class="logo">⚡ จัดการคำถาม</div><a href="/" style="color:#48e6ff">กลับหน้าเกม</a></div>
<section id="login" class="card" style="max-width:480px;margin:35px auto"><h2>เข้าสู่ระบบผู้ดูแล</h2><p class="muted">สำหรับเจ้าของเกมเท่านั้น</p><label>รหัสผ่านผู้ดูแล</label><input id="password" type="password" placeholder="กรอกรหัสผ่าน"><button class="gold" id="loginBtn">เข้าสู่ระบบ</button><div id="loginMsg"></div></section>
<section id="app" class="hidden">
 <div class="card"><div class="row"><div><h2 style="margin:0">คลังคำถามของฉัน</h2><p class="muted" style="margin:5px 0">เพิ่ม แก้ไข และลบโจทย์ได้ ข้อมูลบันทึกในฐานข้อมูล</p></div><button class="gold" id="newBtn">＋ เพิ่มคำถามใหม่</button></div><div class="stats"><div class="stat">คำถามทั้งหมด <b id="total">0</b></div><div class="stat">หมวดหมู่ <b id="cats">0</b></div></div><div class="row" style="margin-top:14px"><input id="search" placeholder="ค้นหาโจทย์หรือหมวดหมู่..." style="margin:0"><select id="filter" style="margin:0"><option value="">ทุกหมวดหมู่</option></select></div></div>
 <div id="editor" class="card hidden"><div class="row"><h2 id="editorTitle">เพิ่มคำถาม</h2><span class="right muted" id="editId"></span></div>
 <label>โจทย์ / คำถาม</label><textarea id="question" placeholder="พิมพ์โจทย์ที่นี่"></textarea>
 <div class="options"><div><label>ตัวเลือก 1</label><input id="o0" placeholder="คำตอบข้อ 1"></div><div><label>ตัวเลือก 2</label><input id="o1" placeholder="คำตอบข้อ 2"></div><div><label>ตัวเลือก 3</label><input id="o2" placeholder="คำตอบข้อ 3"></div><div><label>ตัวเลือก 4</label><input id="o3" placeholder="คำตอบข้อ 4"></div></div>
 <label>คำตอบที่ถูกต้อง</label><select id="correct"><option value="0">ข้อ 1</option><option value="1">ข้อ 2</option><option value="2">ข้อ 3</option><option value="3">ข้อ 4</option></select>
 <div class="grid"><div><label>หมวดหมู่</label><input id="category" placeholder="เช่น วิทยาศาสตร์"></div><div><label>คำอธิบายเฉลย</label><textarea id="explanation" placeholder="อธิบายว่าทำไมคำตอบนี้จึงถูก"></textarea></div></div>
 <div id="formMsg"></div><div class="actions"><button class="gold" id="saveBtn">บันทึกคำถาม</button><button class="ghost" id="cancelBtn">ยกเลิก</button></div></div>
 <div id="list"></div>
</section></main><script>
let token=localStorage.getItem("palisad_admin_token")||"",questions=[],editing=null;const $=id=>document.getElementById(id);
function msg(id,text,error=false){$(id).innerHTML=text?`<div class="msg ${error?'err':''}">${esc(text)}</div>`:""}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{"Content-Type":"application/json","Authorization":"Bearer "+token,...(opts.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||"เกิดข้อผิดพลาด");return d}
async function login(){try{const d=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("password").value})});const j=await d.json();if(!d.ok)throw new Error(j.error);token=j.token;localStorage.setItem("palisad_admin_token",token);$("login").classList.add("hidden");$("app").classList.remove("hidden");await load()}catch(e){msg("loginMsg",e.message,true)}}
$("loginBtn").onclick=login;$("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
async function load(){try{questions=await api("/api/admin/questions");render()}catch(e){if(e.message.includes("รหัสผู้ดูแล")){localStorage.removeItem("palisad_admin_token");token="";$("app").classList.add("hidden");$("login").classList.remove("hidden")}else alert(e.message)}}
function render(){const cats=[...new Set(questions.map(q=>q.category))].sort();$("total").textContent=questions.length;$("cats").textContent=cats.length;const old=$("filter").value;$("filter").innerHTML='<option value="">ทุกหมวดหมู่</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join("");$("filter").value=cats.includes(old)?old:"";const term=$("search").value.toLowerCase(),cat=$("filter").value;const list=questions.filter(q=>(!cat||q.category===cat)&&(!term||(q.question+" "+q.category).toLowerCase().includes(term)));$("list").innerHTML=list.map(q=>`<article class="item"><div class="row"><h3>${esc(q.question)}</h3><span class="tag">${esc(q.category)}</span></div><div class="muted">${q.options.map((o,i)=>`<div class="${i===q.correct_index?'correct':''}">${i+1}. ${esc(o)} ${i===q.correct_index?'✓ คำตอบถูก':''}</div>`).join("")}</div>${q.explanation?`<p class="muted">เฉลย: ${esc(q.explanation)}</p>`:""}<div class="actions"><button class="ghost" onclick="editQ(${q.id})">แก้ไข</button><button class="red" onclick="deleteQ(${q.id})">ลบ</button></div></article>`).join("")||'<div class="card muted">ไม่พบคำถาม ลองเพิ่มคำถามใหม่ได้เลย</div>'}
function clearForm(){editing=null;$("editorTitle").textContent="เพิ่มคำถาม";$("editId").textContent="";$("question").value="";for(let i=0;i<4;i++)$("o"+i).value="";$("correct").value="0";$("category").value="ทั่วไป";$("explanation").value="";msg("formMsg","")}
function openEditor(){clearForm();$("editor").classList.remove("hidden");$("question").focus()}
$("newBtn").onclick=openEditor;$("cancelBtn").onclick=()=>$("editor").classList.add("hidden");
window.editQ=id=>{const q=questions.find(x=>x.id===id);if(!q)return;editing=id;$("editorTitle").textContent="แก้ไขคำถาม";$("editId").textContent="ID "+id;$("question").value=q.question;q.options.forEach((o,i)=>$("o"+i).value=o);$("correct").value=String(q.correct_index);$("category").value=q.category;$("explanation").value=q.explanation;$("editor").classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"})};
$("saveBtn").onclick=async()=>{const body={question:$("question").value,options:[0,1,2,3].map(i=>$("o"+i).value),correct_index:Number($("correct").value),category:$("category").value,explanation:$("explanation").value};try{if(editing)await api("/api/admin/questions/"+editing,{method:"PUT",body:JSON.stringify(body)});else await api("/api/admin/questions",{method:"POST",body:JSON.stringify(body)});$("editor").classList.add("hidden");await load()}catch(e){msg("formMsg",e.message,true)}};
window.deleteQ=async id=>{if(!confirm("ต้องการลบคำถามนี้ใช่หรือไม่?"))return;try{await api("/api/admin/questions/"+id,{method:"DELETE"});await load()}catch(e){alert(e.message)}};
$("search").oninput=render;$("filter").onchange=render;
if(token){$("login").classList.add("hidden");$("app").classList.remove("hidden");load()}
</script></body></html>
